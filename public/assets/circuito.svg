<g id="deposito" data-componente="deposito" aria-label="Depósito común y sensor SD pendiente"><title>Depósito común y sensor SD pendiente</title>
<rect x="520" y="693" width="250" height="112" rx="12" fill="#e0f3fb" stroke="#1486b8" stroke-width="2"/>
<text x="645" y="734" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#183444" font-weight="700" text-anchor="middle">D / DEPÓSITO</text>
<text x="645" y="770" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#56707b" font-weight="400" text-anchor="middle">SD: sensor pendiente</text>
</g>
<g id="bomba-evacuacion" data-componente="bomba-evacuacion" aria-label="P1: bypass desde A1 hasta el filtro; sujeto al nivel del depósito"><title>P1: bypass desde A1 hasta el filtro; sujeto al nivel del depósito</title>
<path d="M225 380H80V588H518" fill="none" stroke="#8057ac" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#bomba)"/>
