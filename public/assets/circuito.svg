<rect x="1027" y="398" width="76" height="34" rx="4" fill="#fff" stroke="#1486b8" stroke-width="2"/>
<text x="1065" y="421" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#183444" font-weight="400" text-anchor="middle">R3</text>
