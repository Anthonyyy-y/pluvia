</g>
<g id="bomba-riego" data-componente="bomba-riego" aria-label="P2: riego desde el depósito, condicionado por luz y agua disponible"><title>P2: riego desde el depósito, condicionado por luz y agua disponible</title>
<path d="M770 749H930" fill="none" stroke="#087f82" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#riego)"/>
