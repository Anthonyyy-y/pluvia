<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1010" viewBox="0 0 1600 1010" role="img" aria-labelledby="titulo descripcion">
<title id="titulo">Esquema hidráulico funcional de la maqueta PIS</title><desc id="descripcion">Entrada manual a A1, A2 y A3. Salidas separadas hacia colector, filtro y depósito. P1 evacua A1 por un bypass. P2 riega la zona verde. Compuerta, rebose y drenaje verde descargan a un recipiente auxiliar externo. Sin telemetría conectada.</desc>
<defs>
        <marker id="agua" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="#1486b8"/></marker>
        <marker id="riego" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="#087f82"/></marker>
        <marker id="aux" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="#c66a22"/></marker>
        <marker id="bomba" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="#8057ac"/></marker>
        </defs>
<rect x="0" y="0" width="1600" height="1010" rx="0" fill="#ffffff" stroke="none" stroke-width="2"/>
<text x="60" y="53" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#087f82" font-weight="700" text-anchor="start">03 / RECORRIDOS DEL AGUA</text>
<text x="60" y="103" font-family="Arial, Helvetica, sans-serif" font-size="38" fill="#183444" font-weight="700" text-anchor="start">Una ruta normal y una salida de respaldo</text>
<text x="60" y="143" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#56707b" font-weight="400" text-anchor="start">Esquema funcional para montaje y web · sin escala · no representa caudales ni estados reales.</text>
<text x="225" y="210" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#56707b" font-weight="400" text-anchor="middle">Aporte manual de agua</text>
<path d="M225 221V248" fill="none" stroke="#1486b8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#agua)"/>
