<path d="M645 470V542" fill="none" stroke="#1486b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#agua)"/>
<text x="1200" y="442" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#183444" font-weight="700" text-anchor="start">R1/R2/R3</text>
<text x="1200" y="469" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#183444" font-weight="400" text-anchor="start">Restricción manual</text>
<text x="1200" y="494" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#183444" font-weight="400" text-anchor="start">para la demostración.</text>
<text x="1200" y="519" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#183444" font-weight="400" text-anchor="start">A1: antes de R1,</text>
<text x="1200" y="544" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#183444" font-weight="400" text-anchor="start">toma para P1.</text>
<text x="700" y="511" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#1486b8" font-weight="700" text-anchor="start">CANAL ABIERTO</text>
<g id="filtro" data-componente="filtro" aria-label="Filtro pasivo desmontable"><title>Filtro pasivo desmontable</title>
<rect x="520" y="545" width="250" height="88" rx="12" fill="#fff3db" stroke="#ba994a" stroke-width="2"/>
<text x="645" y="580" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#183444" font-weight="700" text-anchor="middle">F / FILTRO</text>
<text x="645" y="610" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#183444" font-weight="400" text-anchor="middle">malla + esponja lavable</text>
</g>
<path d="M645 633V690" fill="none" stroke="#1486b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#agua)"/>
