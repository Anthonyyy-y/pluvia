<text x="425" y="369" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#c66a22" font-weight="700" text-anchor="middle">G</text>
<text x="425" y="389" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#c66a22" font-weight="400" text-anchor="middle">servo</text>
<text x="411" y="682" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#c66a22" font-weight="400" text-anchor="end">Auxiliar A1</text>
<path d="M770 790H832V864H970" fill="none" stroke="#c66a22" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="9 6" marker-end="url(#aux)"/>
<text x="844" y="829" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#c66a22" font-weight="400" text-anchor="start">Rebose de D</text>
<path d="M1383 795V841" fill="none" stroke="#c66a22" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="9 6" marker-end="url(#aux)"/>
<rect x="974" y="844" width="554" height="78" rx="12" fill="#fff0e3" stroke="#c66a22" stroke-width="2"/>
<text x="1251" y="876" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#c66a22" font-weight="700" text-anchor="middle">RECIPIENTE EXTERNO ≥ 10 L</text>
<text x="1251" y="904" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#c66a22" font-weight="400" text-anchor="middle">Recoge también el drenaje de la zona verde</text>
</g>
<text x="80" y="740" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#183444" font-weight="400" text-anchor="start">CONTROL LOCAL</text>
<text x="80" y="766" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#183444" font-weight="400" text-anchor="start">ESP32 + LCD + LED + buzzer.</text>
<text x="80" y="792" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#183444" font-weight="400" text-anchor="start">A2/A3 solo supervisan.</text>
<text x="80" y="818" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#183444" font-weight="400" text-anchor="start">LDR mide luz, no humedad.</text>
<text x="80" y="844" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#183444" font-weight="400" text-anchor="start"></text>
<text x="80" y="870" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#183444" font-weight="400" text-anchor="start">Web futura: datos y alertas por Wi-Fi.</text>
<text x="80" y="896" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#183444" font-weight="400" text-anchor="start">El dibujo no confirma un atasco.</text>
<path d="M60 944H1540" fill="none" stroke="#d2dfe4" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<text x="60" y="976" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#56707b" font-weight="400" text-anchor="start">Sin sensor SD válido, el firmware actual bloquea P1 y P2. El desagüe por gravedad sigue existiendo.</text>
<text x="1540" y="976" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#56707b" font-weight="400" text-anchor="end">PIS · 20 NOV 2026 · v01</text>
</svg>