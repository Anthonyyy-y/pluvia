<text x="1045" y="757" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#087f82" font-weight="700" text-anchor="middle">P2 / RIEGO</text>
<path d="M1156 749H1234" fill="none" stroke="#087f82" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#riego)"/>
<rect x="1238" y="702" width="290" height="93" rx="12" fill="#e6f3e8" stroke="#288354" stroke-width="2"/>
<text x="1383" y="741" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#288354" font-weight="700" text-anchor="middle">ZONA VERDE</text>
<text x="1383" y="771" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#288354" font-weight="400" text-anchor="middle">LDR + nivel de D</text>
</g>
<g id="emergencia" data-componente="emergencia" aria-label="Recipiente externo para compuerta, rebose del depósito y drenaje de zona verde"><title>Recipiente externo para compuerta, rebose del depósito y drenaje de zona verde</title>
