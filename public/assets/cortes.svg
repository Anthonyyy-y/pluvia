<text x="1224" y="758" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#183444" font-weight="400" text-anchor="start">F: entrada z ≈ 24 cm.</text>
<text x="1224" y="783" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#183444" font-weight="400" text-anchor="start">F: salida libre z ≈ 20 cm.</text>
