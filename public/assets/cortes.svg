<title id="titulo">Cortes de montaje de la maqueta PIS</title><desc id="descripcion">Corte frontal con alcantarillas elevadas, sensor A1 en torre, motor seco, colector y filtro inferiores. Corte posterior con depósito, bomba de riego y caja seca.</desc>
