<text x="1224" y="247" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#183444" font-weight="400" text-anchor="start">COTAS DE REFERENCIA</text>
<text x="1224" y="274" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#183444" font-weight="400" text-anchor="start">Recipientes: 20 cm de alto.</text>
<text x="1224" y="301" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#183444" font-weight="400" text-anchor="start">Fondo sobre tarima: z = 24.</text>
<text x="1224" y="328" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#183444" font-weight="400" text-anchor="start">Agua útil máxima: z = 36.</text>
<text x="1224" y="355" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#183444" font-weight="400" text-anchor="start">Borde de recipiente: z = 44.</text>
<text x="1224" y="382" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#183444" font-weight="400" text-anchor="start"></text>
<text x="1224" y="409" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#183444" font-weight="400" text-anchor="start">S1: cara a z = 64 cm*.</text>
<text x="1224" y="436" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#183444" font-weight="400" text-anchor="start">D0 = 40 / Dlleno = 28 cm*.</text>
<text x="1224" y="463" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#183444" font-weight="400" text-anchor="start">S2/S3: cara a z = 44 cm.</text>
<text x="1224" y="490" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#183444" font-weight="400" text-anchor="start">D0 = 20 / Dlleno = 8 cm.</text>
