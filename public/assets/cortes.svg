<text x="1224" y="833" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#183444" font-weight="400" text-anchor="start">D: agua útil máx. = 12 cm.</text>
<text x="1224" y="858" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#183444" font-weight="400" text-anchor="start">Rebose D: probar antes de usar.</text>
