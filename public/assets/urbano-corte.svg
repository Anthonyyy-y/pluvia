<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
<title id="title">Corte del subsuelo y recorrido del agua.</title>
<desc id="desc">Las tres cámaras están debajo de las rejillas y descargan al colector. A1 tiene motor, compuerta y bomba de evacuación. El colector y la bomba P1 envían el agua al filtro y al depósito. La bomba P2 alimenta un dispersor en el parterre. La compuerta descarga por una ruta independiente. El ESP32 y la LCD ocupan una caja seca separada del agua.</desc>
<defs>
  <pattern id="tierra" width="34" height="24" patternUnits="userSpaceOnUse"><rect width="34" height="24" fill="#e3e1d3"/><path d="m5 6 3-2m13 13 4-2m8-12 2-1" stroke="#c6c3ae" stroke-width="1.1"/></pattern>
  <pattern id="rejilla" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#33453a"/><rect width="3" height="8" fill="#9dad9d"/></pattern>
  <pattern id="filtro" width="7" height="7" patternUnits="userSpaceOnUse"><rect width="7" height="7" fill="#c5ccae"/><path d="m0 0 7 7m0-7-7 7" stroke="#76886d" stroke-width=".7"/></pattern>
  <marker id="flecha" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="m1 1 5 3-5 3z" fill="#307c78"/></marker>
  <marker id="naranja" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="m1 1 5 3-5 3z" fill="#a56937"/></marker>
  <g id="planta"><path d="M0 0q-3-10-11-12 0 9 11 12m0 0q0-13 8-17 4 9-8 17m0 0q6-7 13-6-3 7-13 6" fill="#5d825d"/><path d="M0 0q-9-5-15-2 6 5 15 2" fill="#81a16a"/></g>
  <g id="camara"><rect x="-31" y="130" width="62" height="8" fill="url(#rejilla)" stroke="#394e40"/><path d="M-28 139v15h-11v78h78v-78H28v-15" fill="#f4f6ec" stroke="#819387" stroke-width="2.5"/><path d="M-37 209q8-4 17 0t17 0t17 0t15 0t8 0v21h-74z" fill="#a4cbca"/><rect x="-8" y="155" width="16" height="6" rx="2" fill="#475f55"/><path d="m-4 165-3 6m11-6 3 6" fill="none" stroke="#8ab6a8" stroke-width="1.2"/></g>
</defs>
<rect width="960" height="540" fill="#f5f7ef"/>
<g font-family="Inter,Arial,sans-serif" fill="#183b2c">
  <text x="44" y="45" font-size="31" font-weight="600">El circuito bajo la calle</text><text x="916" y="42" text-anchor="end" font-size="16">Circunvalación Sur</text>
  <text x="44" y="77" font-size="16" fill="#506757">Corte esquemático con la galería posterior desplegada para seguir las conexiones.</text>
  <rect x="44" y="139" width="872" height="278" fill="url(#tierra)"/><rect x="44" y="130" width="872" height="8" fill="#5b665e"/>
  <g id="superficie"><path d="M402 128h185l-8 8H410z" fill="#8a9b70"/><path d="M402 128h185" stroke="#69805e" stroke-width="3"/><use href="#planta" transform="translate(427 126) scale(.85)"/><use href="#planta" transform="translate(466 127) scale(.6)"/><use href="#planta" transform="translate(539 127) scale(.9)"/><use href="#planta" transform="translate(569 127) scale(.7)"/>
  <path d="M514 128v-10" stroke="#314b3c" stroke-width="4"/><rect x="508" y="114" width="12" height="4" rx="1" fill="#324b3b"/><path d="M522 113l18-13h25" fill="none" stroke="#708c73"/><text x="571" y="105" font-size="16" font-weight="600">Dispersor del parterre</text></g>
  <g id="estaciones" text-anchor="middle" font-size="20" font-weight="600"><use href="#camara" x="158"/><use href="#camara" x="386"/><use href="#camara" x="700"/><text x="158" y="194">A1</text><text x="386" y="194">A2</text><text x="700" y="194">A3</text></g>
  <g id="motor"><circle cx="135" cy="174" r="6" fill="#8b9b8b" stroke="#53665b"/><path d="M135 180v29m-8-3 15 5" stroke="#556e5f" stroke-width="2.2"/><text x="57" y="176" font-size="14">Paletas</text><path d="M101 173h20" stroke="#728572"/></g>
  <g id="control"><rect x="767" y="171" width="130" height="66" rx="4" fill="#eff4e7" stroke="#859780" stroke-width="2"/><text x="832" y="193" text-anchor="middle" font-size="15" font-weight="600">Caja seca</text><text x="832" y="215" text-anchor="middle" font-size="13">ESP32 y LCD</text></g>
  <g id="colector" stroke="#307c78" stroke-width="3.4" fill="none" stroke-linejoin="round"><path d="M175 224v25m228-25v25m314-25v25H132v47" marker-end="url(#flecha)"/><path d="M337 249h-29" marker-end="url(#flecha)"/></g>
  <rect x="348" y="242" width="127" height="21" rx="5" fill="#edf1e5"/><text x="411" y="257" text-anchor="middle" font-size="14" fill="#326b65">Colector común</text>
  <g id="evacuacion"><path d="M120 212H83v99h26" fill="none" stroke="#307c78" stroke-width="3.4" marker-end="url(#flecha)"/><circle cx="83" cy="269" r="13" fill="#deefdf" stroke="#38746d" stroke-width="2"/><text x="83" y="274" text-anchor="middle" font-weight="bold" font-size="13">P1</text></g>
  <g id="filtro-desmontable"><rect x="111" y="299" width="51" height="25" rx="3" fill="url(#filtro)" stroke="#6b8069" stroke-width="2"/><text x="137" y="346" text-anchor="middle" font-size="15" font-weight="600">Filtro</text><path d="M163 312h32v19h25" fill="none" stroke="#307c78" stroke-width="3.4" marker-end="url(#flecha)"/></g>
  <g id="deposito"><path d="M221 324h119v53H221z" stroke="#86978d" stroke-width="2" fill="#f5f7ec"/><path d="M223 350q9-3 19 0t19 0t19 0t19 0t19 0t20 0v25H223z" fill="#a0c9c6"/><text x="280" y="345" text-anchor="middle" font-size="15" font-weight="600">Depósito</text></g>
  <g id="riego"><path d="M514 241v16" fill="none" stroke="#e3e1d3" stroke-width="8"/><path d="M341 359h173V131" fill="none" stroke="#307c78" stroke-width="3.6" marker-end="url(#flecha)"/><circle cx="393" cy="359" r="14" fill="#deefdf" stroke="#38746d" stroke-width="2"/><text x="393" y="364" text-anchor="middle" font-weight="bold" font-size="13">P2</text><text x="530" y="311" font-size="15" fill="#356963">Conducción de riego</text></g>
  <g id="emergencia"><path d="M208 240v17m0 67v15" fill="none" stroke="#e3e1d3" stroke-width="8"/><path d="M197 216h11v179h510" stroke="#a56937" stroke-width="3" stroke-dasharray="7 3" fill="none" marker-end="url(#naranja)"/><rect x="193" y="207" width="8" height="15" fill="#bf9769" stroke="#7b603e"/><rect x="717" y="369" width="185" height="35" rx="3" fill="#f4ebd9" stroke="#a38662"/><text x="810" y="392" text-anchor="middle" font-size="14" font-weight="600">Recogida de emergencia</text></g>
  <g font-size="15"><path d="M44 448h32" stroke="#307c78" stroke-width="4"/><text x="83" y="453">Filtrado y riego</text><path d="M272 448h32" stroke="#a56937" stroke-width="3" stroke-dasharray="6 3"/><text x="311" y="453">Compuerta de A1 y descarga independiente</text></g>
  <text x="44" y="486" font-size="16" fill="#4d6254">P1 evacua desde A1. P2 impulsa desde el depósito. Ambas requieren una lectura válida del depósito.</text>
  <path d="M44 507H916" stroke="#bfcebc"/><text x="44" y="527" font-size="13" fill="#506757">Prototipo de drenaje pluvial · Profundidades y proporciones ilustrativas</text>
</g></svg>
