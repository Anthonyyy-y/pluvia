services:
  - type: web
    name: pluvia-api
    runtime: python
    plan: starter
    buildCommand: pip install waitress==3.0.2
    startCommand: cd server && waitress-serve --listen=0.0.0.0:$PORT --threads=32 --max-request-body-size=16384 --call app:create_application
    healthCheckPath: /brand.svg
    disk:
      name: pluvia-sqlite
      mountPath: /var/data/pluvia
      sizeGB: 1
    envVars:
      - key: DATA_DIR
        value: /var/data/pluvia
      - key: COOKIE_SECURE
        value: "true"
      - key: DEVICE_TOKEN
        generateValue: true
      - key: MONITOR_PASSWORD
        generateValue: true
      - key: PUBLIC_WEB_ORIGIN
        sync: false
